const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x)e.textContent=x;return e};
const msg=t=>{$("#st").textContent=t};
const isU=u=>/^https?:\/\//i.test(u||"");

function clean(d){
  d=d&&typeof d==="object"?d:{};
  const s=(v,n)=>String(v==null?"":v).slice(0,n);
  const favs=(Array.isArray(d.favs)?d.favs:[]).map(x=>{
    if(!x||typeof x.id!=="string")return null;
    if(x.t==="link"&&isU(x.u))return{t:"link",id:s(x.id,600),n:s(x.n,120),u:s(x.u,500)};
    return null;
  }).filter(Boolean).slice(0,2000);
  return {favs};
}
let D=clean({});
try{const v=JSON.parse(localStorage.getItem("osint_favs"));if(v)D=clean(v)}catch(e){}
function save(){try{localStorage.setItem("osint_favs",JSON.stringify(D));msg("Favoris enregistrés ✓")}catch(e){}}
const has=id=>D.favs.some(x=>x.id===id);
function tog(it){D.favs=has(it.id)?D.favs.filter(x=>x.id!==it.id):[...D.favs,it];save()}

function row(n,sub,href,it){
  const r=el("div","r"),a=el("a");
  a.href=href; a.target="_blank"; a.rel="noopener noreferrer";
  a.append(el("b",0,n));
  if(sub)a.append(el("small",0,sub));
  r.append(a);
  if(it){
    const s=el("button","s",has(it.id)?"★":"☆");
    s.title="Favori";
    s.onclick=()=>{tog(it);s.textContent=has(it.id)?"★":"☆";if(tab==="favs")render()};
    r.append(s);
  }
  return r;
}

let tab="all";
function formatUrl(u,query){
  if(!query)return u.includes("{q}")?u.split("{q}").join(""):u;
  return u.split("{q}").join(encodeURIComponent(query));
}

function buildSection(gName, items, query){
  const d=document.createElement("details");
  d.open=true;
  d.append(el("summary",0,gName+" ("+items.length+")"));
  items.forEach(x=>{
    const targetUrl = formatUrl(x.u, query);
    const itemObj={t:"link", id:"l:"+x.u, n:x.n, u:targetUrl};
    d.append(row(x.n, x.u, targetUrl, itemObj));
  });
  return d;
}

function allTab(o){
  const v=q();
  o.append(el("div","hint",v?"Résultats pour la cible : "+v:"Entrez une cible en haut (domaine, IP, e-mail, pseudo) pour l’injecter partout instantanément."));
  DATA.osint.forEach(sec=>{
    o.append(buildSection("OSINT : "+sec.g, sec.t, v));
  });
  DATA.engines.forEach(sec=>{
    o.append(buildSection("Moteur : "+sec.g, sec.t, v));
  });
}

function osintTab(o){
  const v=q();
  DATA.osint.forEach(sec=>{
    o.append(buildSection(sec.g, sec.t, v));
  });
}

function enginesTab(o){
  const v=q();
  DATA.engines.forEach(sec=>{
    o.append(buildSection(sec.g, sec.t, v));
  });
}

function favsTab(o){
  o.append(el("div","sec","Mes favoris"));
  if(!D.favs.length){o.append(el("div","hint","Aucun favori enregistré. Touchez ☆ à côté d’un outil."));return}
  const c=el("div","card");
  D.favs.forEach(x=>c.append(row(x.n, x.u, x.u, x)));
  o.append(c);
}

function render(){
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===tab));
  const o=$("#out"); o.textContent="";
  if(tab==="all")allTab(o);
  else if(tab==="osint")osintTab(o);
  else if(tab==="engines")enginesTab(o);
  else if(tab==="favs")favsTab(o);
  else {
    o.append(el("div","hint","Onglet en cours de chargement ou regroupé."));
  }
}

document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;msg("");render()});
$("#q").addEventListener("input",()=>render());
$("#gs").onclick=()=>render();
$("#go").onclick=()=>{
  const v=q();
  if(!v){msg("Entrez d’abord une cible !");return}
  msg("Ouverture rapide des principaux outils…");
  window.open("https://who.is/whois/"+encodeURIComponent(v), "_blank");
  window.open("https://www.google.com/search?q="+encodeURIComponent(v), "_blank");
  window.open("https://www.virustotal.com/gui/search/"+encodeURIComponent(v), "_blank");
};
$("#th").onclick=()=>{
  const r=document.documentElement, d=matchMedia("(prefers-color-scheme: dark)").matches, c=r.dataset.theme||(d?"dark":"light"), n=c==="dark"?"light":"dark";
  r.dataset.theme=n;
};
render();
</script>
</body>
</html>
